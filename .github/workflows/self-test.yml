# Self-test against fixtures/ — must stay green on this product repo.
name: self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-fixture:
    name: clean fixture should pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Scan clean fixture
        uses: ./actions/npm-supply-chain
        with:
          action-path: ${{ github.workspace }}
          package-manager: npm
          lockfile-paths: |
            fixtures/clean/package-lock.json
          node-version: "22"
          fail-on: high
          install: none
          enable-campaign-ioc: true
          working-directory: "."

  known-bad-ioc:
    name: known-bad fixture should fail IOC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Scan known-bad fixture (expect fail)
        id: scan
        continue-on-error: true
        uses: ./actions/npm-supply-chain
        with:
          action-path: ${{ github.workspace }}
          package-manager: npm
          lockfile-paths: |
            fixtures/known-bad/package-lock.json
          node-version: "22"
          # malware: IOC gate only for audit; still runs OSV in warn mode
          fail-on: malware
          install: none
          enable-campaign-ioc: true
          working-directory: "."

      - name: Assert IOC scan failed the job
        if: steps.scan.outcome == 'success'
        run: |
          echo "Expected known-bad fixture to fail campaign IOC scan, but it passed."
          exit 1

      - name: Confirmed expected failure
        if: steps.scan.outcome == 'failure'
        run: echo "known-bad fixture failed as expected."

  reusable-workflow-smoke:
    name: reusable workflow_call smoke (clean)
    permissions:
      contents: read
    uses: ./.github/workflows/npm-supply-chain.yml
    with:
      package-manager: npm
      lockfile-paths: |
        fixtures/clean/package-lock.json
      node-version: "22"
      fail-on: high
      install: none
      enable-harden-runner: true
      enable-campaign-ioc: true
      working-directory: "."
