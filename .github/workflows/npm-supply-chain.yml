# Reusable supply-chain gate for npm / pnpm / yarn consumers.
# Pin callers to a commit SHA, not @main. See README.md and examples/consumer-workflow.yml.
name: npm-supply-chain

on:
  workflow_call:
    inputs:
      package-manager:
        description: "npm | pnpm | yarn | auto"
        type: string
        required: false
        default: "auto"
      lockfile-paths:
        description: "Newline-separated globs (e.g. **/package-lock.json)"
        type: string
        required: false
        default: |
          **/package-lock.json
          **/pnpm-lock.yaml
          **/yarn.lock
      node-version:
        description: "Node.js version for setup-node"
        type: string
        required: false
        default: "22"
      fail-on:
        description: "high | critical | malware (see docs/concepts.md)"
        type: string
        required: false
        default: "high"
      install:
        description: "none | ci-ignore-scripts | ci — prefer scanning before lifecycle scripts"
        type: string
        required: false
        default: "ci-ignore-scripts"
      enable-harden-runner:
        description: "Enable step-security/harden-runner in audit mode"
        type: boolean
        required: false
        default: true
      enable-campaign-ioc:
        description: "Run curated campaign IOC checks (packages + filenames)"
        type: boolean
        required: false
        default: true
      working-directory:
        description: "Optional subdirectory of the consumer repo"
        type: string
        required: false
        default: "."

# Least privilege: we only read the consumer checkout.
# security-events is NOT requested (no SARIF upload) so private repos stay simple.
permissions:
  contents: read

jobs:
  supply-chain:
    name: npm supply-chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Harden Runner
        if: ${{ inputs.enable-harden-runner }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # External callers: invoke the composite action remotely. Do NOT nest-checkout this
      # repo via github.workflow_sha / job.workflow_sha — under workflow_call those resolve
      # to the *caller* SHA and fail with "not our ref". Keep the action pin on the same
      # release tag as this workflow (v0.1.5).
      - name: Run supply-chain scans
        if: github.repository != 'dbarrett24/supply-chain-ci'
        uses: dbarrett24/supply-chain-ci/actions/npm-supply-chain@7f8d4ed1988de1cbe6bab56de89bde7a116b091a # v0.1.5
        with:
          package-manager: ${{ inputs.package-manager }}
          lockfile-paths: ${{ inputs.lockfile-paths }}
          node-version: ${{ inputs.node-version }}
          fail-on: ${{ inputs.fail-on }}
          install: ${{ inputs.install }}
          enable-campaign-ioc: ${{ inputs.enable-campaign-ioc && 'true' || 'false' }}
          working-directory: ${{ inputs.working-directory }}

      # In-repo self-test / dogfood: use the local composite + workspace root.
      - name: Run supply-chain scans (in-repo)
        if: github.repository == 'dbarrett24/supply-chain-ci'
        uses: ./actions/npm-supply-chain
        with:
          action-path: ${{ github.workspace }}
          package-manager: ${{ inputs.package-manager }}
          lockfile-paths: ${{ inputs.lockfile-paths }}
          node-version: ${{ inputs.node-version }}
          fail-on: ${{ inputs.fail-on }}
          install: ${{ inputs.install }}
          enable-campaign-ioc: ${{ inputs.enable-campaign-ioc && 'true' || 'false' }}
          working-directory: ${{ inputs.working-directory }}
