# Reusable supply-chain gate for npm / pnpm / yarn consumers.
# Pin callers to a commit SHA, not @main. See README.md and examples/consumer-workflow.yml.
name: npm-supply-chain

on:
  workflow_call:
    inputs:
      package-manager:
        description: "npm | pnpm | yarn | auto"
        type: string
        required: false
        default: "auto"
      lockfile-paths:
        description: "Newline-separated globs (e.g. **/package-lock.json)"
        type: string
        required: false
        default: |
          **/package-lock.json
          **/pnpm-lock.yaml
          **/yarn.lock
      node-version:
        description: "Node.js version for setup-node"
        type: string
        required: false
        default: "22"
      fail-on:
        description: "high | critical | malware (see docs/concepts.md)"
        type: string
        required: false
        default: "high"
      install:
        description: "none | ci-ignore-scripts | ci — prefer scanning before lifecycle scripts"
        type: string
        required: false
        default: "ci-ignore-scripts"
      enable-harden-runner:
        description: "Enable step-security/harden-runner in audit mode"
        type: boolean
        required: false
        default: true
      enable-campaign-ioc:
        description: "Run curated campaign IOC checks (packages + filenames)"
        type: boolean
        required: false
        default: true
      working-directory:
        description: "Optional subdirectory of the consumer repo"
        type: string
        required: false
        default: "."

# Least privilege: we only read the consumer checkout.
# security-events is NOT requested (no SARIF upload) so private repos stay simple.
permissions:
  contents: read

jobs:
  supply-chain:
    name: npm supply-chain
    runs-on: ubuntu-latest
    steps:
      # 1) Consumer sources (lockfiles under test)
      - name: Checkout consumer repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2) Optional Harden-Runner (egress awareness). Placed after checkout per product contract;
      #    StepSecurity docs prefer it first — acceptable for audit-mode visibility.
      - name: Harden Runner
        if: ${{ inputs.enable-harden-runner }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Tooling lives in this product repo. When the caller is this repo, reuse the
      # consumer checkout (avoids a nested clone). github.workflow_sha pins the
      # called workflow commit for external consumers.
      - name: Resolve tooling path
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" == "dbarrett24/supply-chain-ci" ]]; then
            echo "action-path=${GITHUB_WORKSPACE}" >> "${GITHUB_OUTPUT}"
            echo "need-checkout=false" >> "${GITHUB_OUTPUT}"
          else
            echo "action-path=${GITHUB_WORKSPACE}/.supply-chain-ci" >> "${GITHUB_OUTPUT}"
            echo "need-checkout=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout supply-chain-ci tooling
        if: steps.tools.outputs.need-checkout == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dbarrett24/supply-chain-ci
          ref: ${{ github.workflow_sha }}
          path: .supply-chain-ci

      - name: Run supply-chain scans
        uses: ./.supply-chain-ci/actions/npm-supply-chain
        if: steps.tools.outputs.need-checkout == 'true'
        with:
          action-path: ${{ steps.tools.outputs.action-path }}
          package-manager: ${{ inputs.package-manager }}
          lockfile-paths: ${{ inputs.lockfile-paths }}
          node-version: ${{ inputs.node-version }}
          fail-on: ${{ inputs.fail-on }}
          install: ${{ inputs.install }}
          enable-campaign-ioc: ${{ inputs.enable-campaign-ioc && 'true' || 'false' }}
          working-directory: ${{ inputs.working-directory }}

      - name: Run supply-chain scans (in-repo)
        uses: ./actions/npm-supply-chain
        if: steps.tools.outputs.need-checkout == 'false'
        with:
          action-path: ${{ steps.tools.outputs.action-path }}
          package-manager: ${{ inputs.package-manager }}
          lockfile-paths: ${{ inputs.lockfile-paths }}
          node-version: ${{ inputs.node-version }}
          fail-on: ${{ inputs.fail-on }}
          install: ${{ inputs.install }}
          enable-campaign-ioc: ${{ inputs.enable-campaign-ioc && 'true' || 'false' }}
          working-directory: ${{ inputs.working-directory }}
